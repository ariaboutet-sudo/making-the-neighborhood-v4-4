<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Making the Neighborhood</title>
  <meta name="description" content="An interactive map of community organizing around Tompkins Square Park and the Lower East Side.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div id="site-shell">
    <aside id="story-panel">
      <header class="site-header">
        <p class="eyebrow">Community organizing around Tompkins Square Park</p>
        <h1>Making the Neighborhood</h1>
      </header>

      <section class="park-introduction">
        <button id="park-intro-button" type="button" aria-label="Open Tompkins Square Park">
          <span class="park-intro-dot" aria-hidden="true"></span>
          <span>
            <strong>Tompkins Square Park</strong>
            <small>geographic + symbolic center</small>
          </span>
        </button>
      </section>

      <section class="theme-section">
        <h2>Ways of Making the Neighborhood</h2>
        <div id="theme-buttons" class="theme-buttons"></div>
      </section>

      <section id="theme-copy" class="theme-copy" aria-live="polite">
</section>

      <section id="site-detail" class="site-detail" aria-live="polite"></section>
    </aside>

    <main id="map-wrap">
     <div id="map" aria-label="Interactive map of community organizing sites"></div>
<div id="theme-lens"></div>

      <div id="image-overlay" class="image-overlay" aria-hidden="true">
        <button id="close-image" class="close-image" type="button" aria-label="Close image">×</button>
        <button id="previous-slide" class="slide-arrow slide-arrow-left" type="button" aria-label="Previous image">‹</button>
        <button id="next-slide" class="slide-arrow slide-arrow-right" type="button" aria-label="Next image">›</button>

        <figure>
          <div id="overlay-quote" class="overlay-quote" hidden>
  <blockquote id="overlay-quote-text"></blockquote>
  <cite id="overlay-quote-attribution"></cite>
</div>
          <img id="overlay-image" src="" alt="">
          <figcaption>
            <strong id="overlay-title"></strong>
            <span id="overlay-caption"></span>
            <span id="overlay-credit"></span>
            <blockquote id="overlay-quote"></blockquote>
<span id="overlay-quote-credit"></span>
            <a id="overlay-source" href="#" target="_blank" rel="noopener noreferrer">View source</a>
            <span id="slide-counter"></span>
          </figcaption>
        </figure>
      </div>

      <button id="home-view" type="button">Return to the park</button>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
